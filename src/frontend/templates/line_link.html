<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เชื่อมต่อ LINE | V CARCARE</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: grid; place-items: center; min-height: 100vh; margin: 0 }
        .card { width: min(420px, calc(100% - 40px)); padding: 28px; background: #1f1f1f; border-radius: 14px; text-align: center; box-sizing: border-box }
        button { background: #06c755; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-weight: bold; cursor: pointer }
        button:disabled { opacity: .55; cursor: wait }
        .error { color: #ff9b9b }
    </style>
</head>
<body data-liff-id="{{ liff_id|default('', true)|e }}">
    <main class="card">
        <h2>เชื่อมต่อ LINE</h2>
        <p id="message" role="status">กำลังตรวจสอบลิงก์...</p>
        <button id="connect" type="button" hidden>เชื่อมต่อบัญชี LINE</button>
    </main>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" onerror="window.liffSdkFailed=true"></script>
    <script>
        const liffId = document.body.dataset.liffId;
        const message = document.getElementById('message');
        const button = document.getElementById('connect');
        let linkToken;

        function showError(text) {
            message.textContent = text;
            message.classList.add('error');
            button.hidden = true;
        }

        async function fetchLinkDetails() {
            const response = await fetch(`/api/line/link/${encodeURIComponent(linkToken)}`, { credentials: 'same-origin' });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'ไม่สามารถตรวจสอบลิงก์ได้');
            message.textContent = `เชื่อมต่อการแจ้งเตือนสำหรับรถ ${data.vehicle.license_plate} ${data.vehicle.province || ''}`;
        }

        async function connectLine() {
            button.disabled = true;
            try {
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                    return;
                }
                const accessToken = liff.getAccessToken();
                if (!accessToken) throw new Error('ไม่พบ LINE access token');
                const response = await fetch('/api/line/link/confirm', {
                    method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: linkToken, access_token: accessToken })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'ไม่สามารถเชื่อม LINE ได้');
                message.textContent = `เชื่อมต่อ LINE สำเร็จแล้ว${data.display_name ? ` คุณ ${data.display_name}` : ''}`;
                button.hidden = true;
            } catch (error) {
                showError(error.message || 'ไม่สามารถเชื่อม LINE ได้');
            } finally {
                button.disabled = false;
            }
        }

        (async () => {
            try {
                if (window.liffSdkFailed || !window.liff) throw new Error('ไม่สามารถโหลด LINE LIFF ได้');
                if (!liffId) throw new Error('ระบบยังไม่ได้ตั้งค่า LINE_LIFF_ID');
                await liff.init({ liffId });
                linkToken = new URLSearchParams(window.location.search).get('token');
                if (!linkToken) throw new Error('ไม่พบลิงก์เชื่อมต่อ');
                await fetchLinkDetails();
                button.hidden = false;
                button.addEventListener('click', connectLine);
            } catch (error) {
                showError(error.message || 'ไม่สามารถเปิดลิงก์เชื่อมต่อได้');
            }
        })();
    </script>
</body>
</html>
