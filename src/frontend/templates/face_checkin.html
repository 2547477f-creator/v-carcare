<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สแกนหน้าเช็คอิน - V CarCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background: #121212; color: #fff; min-height: 100vh; }
        .scan-card { max-width: 560px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; }
        .camera-frame { aspect-ratio: 4 / 3; background: #090909; border: 2px solid #ff6b00; border-radius: 14px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-guide { position: absolute; inset: 12% 25%; border: 3px dashed rgba(255, 107, 0, .9); border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
    <main class="scan-card w-100 p-4 text-center shadow-lg">
        <h2 class="h4 fw-bold text-warning mb-2"><i class="bi bi-camera-fill me-2"></i>สแกนหน้าเช็คอิน</h2>
        <p class="text-secondary small mb-4">จัดใบหน้าให้อยู่ในกรอบ แล้วกดบันทึกการเช็คอิน</p>

        {% if not scan_allowed and face_mode not in ('change-ip', 'enroll', 'verify-manager-change') %}<div class="alert alert-warning py-2 small">เครื่องนี้ไม่ใช่เครื่องหลักที่ตั้งค่าไว้ การสแกนจะไม่สามารถเข้าสู่ระบบได้</div>{% endif %}
        <div class="camera-frame mb-3">
            <video id="camera-preview" autoplay playsinline muted></video>
            <div class="face-guide"></div>
        </div>
        <p id="camera-status" class="small text-secondary mb-3">กด “เปิดกล้อง” เพื่อเริ่มสแกน</p>

        <div class="d-grid gap-2">

    <button id="start-camera" class="btn btn-warning fw-bold" type="button">
        <i class="bi bi-camera-video-fill me-2"></i>เปิดกล้อง
    </button>

    <!-- เพิ่มอันนี้ -->
    <button id="scan-face" class="btn btn-success fw-bold" type="button" disabled>
        <i class="bi bi-person-check-fill me-2"></i>สแกนใบหน้า
    </button>

    <button id="stop-camera" class="btn btn-outline-secondary" type="button" disabled>
        <i class="bi bi-camera-video-off me-2"></i>ปิดกล้อง
    </button>

    <a href="{{ url_for('login') }}" class="btn btn-outline-light">
        <i class="bi bi-arrow-left me-2"></i>กลับหน้าล็อกอิน
    </a>

</div>
    </main>

    <script>
        const mode = new URLSearchParams(location.search).get('mode') || 'login';
        const expectedRole = new URLSearchParams(location.search).get('role');
        const video = document.getElementById('camera-preview');
        const status = document.getElementById('camera-status');
        const startButton = document.getElementById('start-camera');
        const stopButton = document.getElementById('stop-camera');
        const scanButton = document.getElementById('scan-face');
        let stream = null;

        if (mode === 'enroll' || mode === 'verify-manager-change') {
            const isManagerVerification = mode === 'verify-manager-change';
            document.title = 'ลงทะเบียนใบหน้าผู้จัดการ - V CarCare';
            document.querySelector('h2').innerHTML = isManagerVerification ? '<i class="bi bi-shield-check me-2"></i>ยืนยันผู้จัดการเดิม' : '<i class="bi bi-person-bounding-box me-2"></i>ลงทะเบียนใบหน้าผู้จัดการ';
            document.querySelector('main p').textContent = isManagerVerification ? 'สแกนใบหน้าผู้จัดการเดิมก่อนดำเนินการเปลี่ยนผู้จัดการ' : 'จัดใบหน้าให้อยู่ในกรอบ แล้วกดบันทึกเพื่อใช้ยืนยันตัวตนในภายหลัง';
            scanButton.innerHTML = isManagerVerification ? '<i class="bi bi-shield-check me-2"></i>ยืนยันใบหน้า' : '<i class="bi bi-person-check-fill me-2"></i>บันทึกใบหน้า';
        }
        if (mode === 'change-ip') {
            document.title = 'ตั้งค่า IP เครื่องหลัก - V CarCare';
            document.querySelector('h2').innerHTML = '<i class="bi bi-router-fill me-2"></i>ตั้งค่า IP เครื่องหลัก';
            document.querySelector('main p').textContent = 'สแกนใบหน้าผู้จัดการที่กำลังเข้าสู่ระบบ เพื่อบันทึก IP ของเครื่องนี้เป็นเครื่องหลัก';
            scanButton.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>ยืนยันและตั้งค่า IP';
        }

        async function startCamera() {
            try {
                if (!navigator.mediaDevices?.getUserMedia) throw new Error('unsupported');
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'user' } }, audio: false });
                video.srcObject = stream;
                status.textContent = 'เปิดกล้องแล้ว — โปรดจัดใบหน้าให้อยู่ในกรอบ';
                status.className = 'small text-success mb-3';
                startButton.disabled = true;
                stopButton.disabled = false;
                scanButton.disabled = false;
            } catch (error) {
                status.textContent = location.protocol === 'http:' && location.hostname !== 'localhost' ? 'เบราว์เซอร์บล็อกกล้องบน HTTP: กรุณาเปิดผ่าน localhost หรือ HTTPS' : 'ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์';
                status.className = 'small text-danger mb-3';
            }
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            stream = null;
            video.srcObject = null;
            status.textContent = 'ปิดกล้องแล้ว';
            status.className = 'small text-secondary mb-3';
            startButton.disabled = false;
            stopButton.disabled = true;
            scanButton.disabled = true;
        }
        async function scanFace() {

    // ตรวจว่ากล้องเปิดหรือยัง
    if (!stream) {
        status.textContent = "กรุณาเปิดกล้องก่อน";
        status.className = "small text-danger mb-3";
        return;
    }

    status.textContent = "กำลังตรวจสอบใบหน้า...";
    status.className = "small text-warning mb-3";

    // จับภาพจากกล้อง
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    // กลับภาพให้ตรง เพราะ preview ใช้ scaleX(-1)
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // แปลงเป็น Base64
    const image = canvas.toDataURL("image/jpeg");

    try {

        const endpoint = mode === 'enroll' ? '/api/manager/face-enroll' : mode === 'verify-manager-change' ? '/api/security/verify-current-manager' : mode === 'change-ip' ? '/api/security/change-primary-face-ip' : mode === 'reset' ? '/api/password-reset/face' : '/api/face-login';
        const payload = mode === 'enroll' ? { face_images: [image] } : { face_image: image };
        if (mode === 'login' && ['manager', 'staff'].includes(expectedRole)) payload.expected_role = expectedRole;
        if (mode === 'reset') {
            const resetRequest = JSON.parse(sessionStorage.getItem('passwordResetRequest') || 'null');
            if (!resetRequest) throw new Error('ไม่พบข้อมูลการรีเซ็ตรหัสผ่าน');
            payload.role = resetRequest.role; payload.new_password = resetRequest.password;
            if (payload.role === 'manager') payload.username = resetRequest.identity; else payload.staff_id = resetRequest.identity;
        }
        const response = await fetch(endpoint, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(payload)

        });

        const result = await response.json();

        if (result.status === "success") {

            status.textContent = "ยืนยันตัวตนสำเร็จ กำลังเข้าสู่ระบบ...";
            status.className = "small text-success mb-3";

            if (mode === 'reset') sessionStorage.removeItem('passwordResetRequest');
            setTimeout(() => { window.location.href = result.redirect || '/login'; }, 700);

        } else {

            status.textContent = result.message;
            status.className = "small text-danger mb-3";

        }

    } catch (err) {

        console.error(err);

        status.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์";
        status.className = "small text-danger mb-3";

    }

}
        startButton.addEventListener('click', startCamera);
        stopButton.addEventListener('click', stopCamera);
        scanButton.addEventListener('click', scanFace);
        window.addEventListener('beforeunload', stopCamera);
    </script>
</body>
</html>
