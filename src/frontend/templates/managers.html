<!doctype html>
<html lang="th"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>จัดการผู้จัดการ - V CarCare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" /><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" /><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" /></head>
<body class="bg-dark text-white"><main class="container py-4" style="max-width:700px"><div class="d-flex justify-content-between align-items-center mb-4"><h3 class="mb-0"><i class="bi bi-people-fill me-2"></i>จัดการผู้จัดการ</h3><a href="/" class="btn btn-outline-light btn-sm">กลับหน้าหลัก</a></div><p class="text-secondary">เพิ่มบัญชีผู้จัดการได้สูงสุด 3 คน</p><div id="notice"></div><div class="card bg-black border-secondary mb-4"><div class="card-body"><form id="manager-form" class="row g-3"><div class="col-md-5"><label class="form-label" for="username">ชื่อผู้ใช้</label><input id="username" class="form-control" required maxlength="100" autocomplete="username" /></div><div class="col-md-5"><label class="form-label" for="password">รหัสผ่าน</label><input id="password" type="password" class="form-control" required minlength="6" autocomplete="new-password" /></div><div class="col-md-2 d-grid align-self-end"><button id="submit" class="btn btn-warning">เพิ่ม</button></div></form></div></div><div class="card bg-black border-secondary"><div class="card-body"><h5 class="card-title">บัญชีผู้จัดการ <span id="count" class="text-warning"></span></h5><ul id="manager-list" class="list-group list-group-flush"></ul></div></div></main>
<script>
const form=document.querySelector('#manager-form'),notice=document.querySelector('#notice');const show=(m,t='danger')=>notice.innerHTML=`<div class="alert alert-${t}">${m}</div>`;async function loadManagers(){const r=await fetch('/api/managers'),d=await r.json();if(!r.ok)return show(d.message||'ไม่สามารถโหลดข้อมูลได้');document.querySelector('#count').textContent=`(${d.managers.length}/${d.maximum})`;document.querySelector('#manager-list').innerHTML=d.managers.map(x=>`<li class="list-group-item bg-black text-white border-secondary d-flex justify-content-between"><span>${x.username}</span><span class="text-success">ใช้งานอยู่</span></li>`).join('');document.querySelector('#submit').disabled=d.managers.length>=d.maximum}form.addEventListener('submit',async e=>{e.preventDefault();notice.innerHTML='';const r=await fetch('/api/managers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})}),d=await r.json();if(!r.ok)return show(d.message||'เพิ่มผู้จัดการไม่สำเร็จ');form.reset();show(d.message,'success');loadManagers()});loadManagers();
</script></body></html>
