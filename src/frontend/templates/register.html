<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V CarCare - ลงทะเบียนรถ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>.sidebar{width:260px;min-height:100vh;background:#1a1a1a;padding:20px}.sidebar .nav-link{color:#aaa;padding:12px 14px;border-radius:10px;margin-bottom:6px}.sidebar .nav-link:hover{background:#292929;color:#fff}.sidebar .nav-link.active{background:#ff6b00;color:#111;font-weight:bold}@media(max-width:767px){.sidebar{display:none}}</style>
</head>
{% if session_role != 'manager' %}
<style>
    .sidebar .nav-link[href="/staff"], .sidebar .nav-link[href="/staff-advances"], .sidebar .nav-link[href="/finance"], .sidebar .nav-link[href="/service-management"] { display: none !important; }
</style>
{% endif %}
<body class="bg-dark text-white">
    <div class="d-flex">
    <aside class="sidebar flex-shrink-0">
        <h3 class="text-orange text-center fw-bold mb-4">V CARCARE</h3>
        <nav class="nav flex-column">
            <a class="nav-link" href="/service-management"><i class="bi bi-tags me-2"></i>จัดการบริการและโปรโมชัน</a>
            <a class="nav-link" href="/history"><i class="bi bi-clock-history me-2"></i>ประวัติรถที่รับแล้ว</a>
            <a class="nav-link" href="/"><i class="bi bi-speedometer2 me-2"></i>ภาพรวมระบบ</a>
            <a class="nav-link" href="/pos"><i class="bi bi-cart-check me-2"></i>รับรถ</a>
            <a class="nav-link active" href="/register"><i class="bi bi-person-vcard me-2"></i>ลงทะเบียนลูกค้าและรถ</a>
            <a class="nav-link" href="/staff"><i class="bi bi-people-fill me-2"></i>จัดการพนักงาน</a>
            <a class="nav-link" href="/staff-advances"><i class="bi bi-cash-stack me-2"></i>จัดการการเบิกพนักงาน</a>
            <a class="nav-link" href="/finance"><i class="bi bi-wallet2 me-2"></i>สรุปบัญชีรายรับ</a>
            <a class="nav-link text-danger mt-3" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right me-2"></i>ออกจากระบบ</a>
        </nav>
    </aside>
    <main class="container py-4" style="max-width: 760px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="m-0 text-orange"><i class="bi bi-person-vcard me-2"></i>ลงทะเบียนลูกค้าและรถ</h2>
            <a class="btn btn-outline-light" href="/pos">ไปหน้ารับรถ</a>
        </div>
        <div id="alertBox"></div>
        <form id="registerForm" class="card bg-black border-secondary p-4">
            <h5 class="text-orange mb-3">ข้อมูลลูกค้า</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6"><label class="form-label">เบอร์โทรศัพท์ *</label><input id="phone" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">ไอดีไลน์</label><input id="lineId" class="form-control"></div>
            </div>
            <h5 class="text-orange mb-3">ข้อมูลรถ</h5>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">ทะเบียนรถ *</label><input id="licensePlate" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">จังหวัด</label><input id="province" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">ประเภทรถ *</label><select id="category" class="form-select" required onchange="setSizes()"><option value="">-- เลือกประเภทรถ --</option><option value="car">รถยนต์</option><option value="bike">มอเตอร์ไซค์</option></select></div>
                <div class="col-md-6"><label class="form-label">ขนาดรถ *</label><select id="size" class="form-select" required disabled><option value="">-- เลือกประเภทรถก่อน --</option></select></div>
            </div>
            <button class="btn btn-warning mt-4 fw-bold" type="submit"><i class="bi bi-save me-2"></i>บันทึกการลงทะเบียน</button>
        </form>
    </main>
    </div>
    <script>
        function setSizes() {
            const size = document.getElementById('size'), category = document.getElementById('category').value;
            const options = category === 'car' ? [['S','S - รถเก๋งเล็ก'],['M','M - รถเก๋งกลาง/ใหญ่'],['L','L - SUV'],['XL','XL - รถตู้']] : [['S','S - เล็ก'],['M','M - กลาง'],['L','L - บิ๊กไบค์']];
            size.disabled = !category; size.innerHTML = '<option value="">-- เลือกขนาดรถ --</option>' + (category ? options.map(x => `<option value="${x[0]}">${x[1]}</option>`).join('') : '');
        }
        function alertBox(message, type) { document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${message}</div>`; }
        document.getElementById('registerForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = { phone: phone.value.trim(), line_id: lineId.value.trim(), license_plate: licensePlate.value.trim(), province: province.value.trim(), category: category.value, size: size.value };
            const res = await fetch('/api/registrations', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            if (!res.ok) return alertBox(data.message || data.error || 'บันทึกไม่สำเร็จ', 'danger');
            alertBox('ลงทะเบียนเรียบร้อยแล้ว สามารถไปเปิดคิวที่หน้า POS ได้', 'success'); event.target.reset(); setSizes();
        });
    </script>
</body>
</html>
