<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V CarCare - รับรถหน้าร้าน (POS)</title>

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Global Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .sidebar {
            width: 260px;
            background-color: #1A1A1A;
            min-height: 100vh;
            padding: 20px;
            border-right: 1px solid #2A2A2A;
        }

        .sidebar .nav-link {
            color: #A0A0A0;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .sidebar .nav-link:hover {
            color: #FFF;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar .nav-link.active {
            background-color: #FF6B00 !important;
            color: #000000 !important;
            font-weight: bold;
        }

        .sidebar .nav-link.text-danger {
            color: #FF4D4D !important;
        }

        /* Form Custom Design */
        .form-card {
            background-color: #1E1E1E;
            border: 1px solid #2D2D2D;
            border-radius: 16px;
            padding: 24px;
        }

        .form-control, .form-select {
            background-color: #2A2A2A;
            border: 1px solid #3A3A3A;
            color: #FFF;
            border-radius: 10px;
            padding: 10px 14px;
        }

        .form-control:focus, .form-select:focus {
            background-color: #2A2A2A;
            border-color: #FF6B00;
            color: #FFF;
            box-shadow: none;
        }

        .service-checkbox-card {
            background-color: #2A2A2A;
            border: 1px solid #3A3A3A;
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .service-checkbox-card:hover {
            border-color: #FF6B00;
        }

        .price-summary-box {
            background-color: #141414;
            border: 2px dashed #FF6B00;
            border-radius: 16px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="wrapper d-flex">
        <!-- Sidebar -->
        <div class="sidebar d-none d-md-block">
            <h3 class="text-orange fw-bold text-center mb-4">V CARCARE</h3>
            <nav class="nav flex-column">
                <a class="nav-link" href="/"><i class="bi bi-speedometer2 me-2"></i> ภาพรวมระบบ</a>
                <a class="nav-link active" href="/pos"><i class="bi bi-plus-circle-fill me-2"></i> รับรถหน้าร้าน (POS)</a>
                <a class="nav-link" href="/staff"><i class="bi bi-people-fill me-2"></i> จัดการพนักงาน</a>
                <a class="nav-link" href="/finance"><i class="bi bi-wallet2 me-2"></i> สรุปบัญชีรายรับ</a>
                <a class="nav-link logout-link text-danger mt-2" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right me-2"></i> ออกจากระบบ</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content flex-grow-1 p-4">
            <h2 class="fw-bold text-white mb-4"><i class="bi bi-plus-circle-fill text-orange me-2"></i>บันทึกรับรถหน้าร้าน (POS)</h2>

            <form id="posForm" onsubmit="submitForm(event)">
                <div class="row g-4">
                    <!-- ฝั่งซ้าย: ข้อมูลลูกค้าและประเภทรถ -->
                    <div class="col-lg-7">
                        <div class="form-card mb-4">
                            <h5 class="text-orange fw-bold mb-3"><i class="bi bi-person-lines-fill me-2"></i>ข้อมูลลูกค้า & รถยนต์</h5>
                            
                            <div class="row g-3">
                                <!-- ทะเบียนรถ -->
                                <div class="col-md-6">
                                    <label class="form-label text-secondary">ทะเบียนรถ <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" placeholder="เช่น กข 1234 กรุงเทพฯ" required id="licensePlate">
                                </div>

                                <!-- เบอร์โทรศัพท์ -->
                                <div class="col-md-6">
                                    <label class="form-label text-secondary">เบอร์โทรศัพท์ <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" placeholder="08X-XXX-XXXX" required id="phone">
                                </div>

                                <!-- Line ID -->
                                <div class="col-md-6">
                                    <label class="form-label text-secondary">Line ID (ถ้ามี)</label>
                                    <input type="text" class="form-control" placeholder="ไอดีไลน์ลูกค้า" id="lineId">
                                </div>

                                <!-- ประเภทรถ -->
                                <div class="col-md-6">
                                    <label class="form-label text-secondary">ประเภทยานพาหนะ <span class="text-danger">*</span></label>
                                    <select class="form-select" id="vehicleCategory" onchange="updateSizeOptions()" required>
                                        <option value="">-- เลือกประเภทรถ --</option>
                                        <option value="car">รถยนต์ / เก๋ง / SUV / รถตู้</option>
                                        <option value="bike">มอเตอร์ไซค์</option>
                                    </select>
                                </div>

                                <!-- ขนาดรถ (Size) -->
                                <div class="col-12">
                                    <label class="form-label text-secondary">ขนาดรถ (Size) <span class="text-danger">*</span></label>
                                    <select class="form-select" id="vehicleSize" onchange="calculatePrice()" required disabled>
                                        <option value="">-- กรุณาเลือกประเภทรถก่อน --</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- เลือกบริการ -->
                        <div class="form-card">
                            <h5 class="text-orange fw-bold mb-3"><i class="bi bi-card-checklist me-2"></i>เลือกบริการ</h5>
                            <div class="d-flex flex-column gap-2" id="serviceContainer">
                                <p class="text-secondary small m-0">กรุณาเลือกประเภทและขนาดรถก่อนเพื่อดูรายการบริการ</p>
                            </div>
                        </div>
                    </div>

                    <!-- ฝั่งขวา: สรุปยอดเงินและปุ่มบันทึก -->
                    <div class="col-lg-5">
                        <div class="price-summary-box text-center mb-4">
                            <span class="text-secondary d-block mb-1">ยอดรวมทั้งหมด</span>
                            <h1 class="display-4 fw-bold text-orange m-0" id="totalPrice">0.00</h1>
                            <span class="text-secondary fs-5">บาท</span>
                        </div>

                        <div class="form-card mb-4">
                            <h5 class="text-white fw-bold mb-3"><i class="bi bi-wallet2 text-orange me-2"></i>ช่องทางชำระเงิน</h5>
                            <div class="d-flex gap-3">
                                <div class="form-check flex-fill p-3 border border-secondary rounded-3">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="payCash" value="cash" checked>
                                    <label class="form-check-label text-white fw-bold" for="payCash">
                                        <i class="bi bi-cash-stack me-1 text-success"></i> เงินสด
                                    </label>
                                </div>
                                <div class="form-check flex-fill p-3 border border-secondary rounded-3">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="payTransfer" value="transfer">
                                    <label class="form-check-label text-white fw-bold" for="payTransfer">
                                        <i class="bi bi-qr-code-scan me-1 text-info"></i> โอนเงิน
                                    </label>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning btn-lg w-100 py-3 fw-bold fs-5 rounded-3 text-dark" style="background-color: #FF6B00; border: none;">
                            <i class="bi bi-check-circle-fill me-2"></i>บันทึกเข้าคิว
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Calculation Logic -->
    <script>
        // ตารางราคารถยนต์
        const carPrices = {
            'S': { wash: 100, washVacuum: 160, fullFlush: 360, engineWash: 260, fullEngine: 460, ozone: 500, wax: 460 },
            'M': { wash: 120, washVacuum: 180, fullFlush: 380, engineWash: 280, fullEngine: 480, ozone: 500, wax: 480 },
            'L': { wash: 140, washVacuum: 220, fullFlush: 420, engineWash: 320, fullEngine: 520, ozone: 600, wax: 620 },
            'XL': { wash: 160, washVacuum: 260, fullFlush: 460, engineWash: 360, fullEngine: 560, ozone: 600, wax: 860 }
        };

        // ตารางราคามอเตอร์ไซค์
        const bikePrices = {
            'S': 80,   // 50-150 cc
            'M': 100,  // 150-300 cc
            'L': 120   // >300 cc
        };

        function updateSizeOptions() {
            const category = document.getElementById('vehicleCategory').value;
            const sizeSelect = document.getElementById('vehicleSize');
            sizeSelect.innerHTML = '<option value="">-- เลือกขนาดรถ --</option>';
            sizeSelect.disabled = false;

            if (category === 'car') {
                sizeSelect.innerHTML += `
                    <option value="S">S - รถเก๋งเล็ก (Yaris, March, Brio)</option>
                    <option value="M">M - รถเก๋งกลาง/ใหญ่ (Civic, Altis, Benz C/E-Class)</option>
                    <option value="L">L - รถ SUV / ครอบครัว (Fortuner, CR-V, Pajero)</option>
                    <option value="XL">XL - รถตู้ (Alphard, Commuter)</option>
                `;
            } else if (category === 'bike') {
                sizeSelect.innerHTML += `
                    <option value="S">S - มอเตอร์ไซค์เล็ก (50 - 150 cc)</option>
                    <option value="M">M - มอเตอร์ไซค์กลาง (150 - 300 cc)</option>
                    <option value="L">L - บิ๊กไบค์ (>300 cc ขึ้นไป)</option>
                `;
            } else {
                sizeSelect.disabled = true;
            }

            renderServices();
            calculatePrice();
        }

        function renderServices() {
            const category = document.getElementById('vehicleCategory').value;
            const container = document.getElementById('serviceContainer');
            container.innerHTML = '';

            if (category === 'car') {
                container.innerHTML = `
                    <label class="service-checkbox-card d-flex justify-content-between align-items-center">
                        <div><input type="checkbox" class="form-check-input me-2 service-item" value="wash" onchange="calculatePrice()"> ล้างสี</div>
                    </label>
                    <label class="service-checkbox-card d-flex justify-content-between align-items-center">
                        <div><input type="checkbox" class="form-check-input me-2 service-item" value="washVacuum" onchange="calculatePrice()"> ล้างสี-ดูดฝุ่น</div>
                    </label>
                    <label class="service-checkbox-card d-flex justify-content-between align-items-center">
                        <div><input type="checkbox" class="form-check-input me-2 service-item" value="fullFlush" onchange="calculatePrice()"> ล้างสี-ดูดฝุ่น-ล้างอัดฉีด</div>
                    </label>
                    <label class="service-checkbox-card d-flex justify-content-between align-items-center">
                        <div><input type="checkbox" class="form-check-input me-2 service-item" value="engineWash" onchange="calculatePrice()"> ล้างสี-ดูดฝุ่น-ล้างห้องเครื่อง</div>
                    </label>
                    <label class="service-checkbox-card d-flex justify-content-between align-items-center">
                        <div><input type="checkbox" class="form-check-input me-2 service-item" value="fullEngine" onchange="calculatePrice()"> ล้างสี-ดูดฝุ่น-ล้างอัดฉีด-ล้างห้องเครื่อง</div>
                    </label>
                    <label class="service-checkbox-card d-flex justify-content-between align-items-center">
                        <div><input type="checkbox" class="form-check-input me-2 service-item" value="ozone" onchange="calculatePrice()"> อบโอโซนปรับอากาศฆ่าเชื้อ</div>
                    </label>
                    <label class="service-checkbox-card d-flex justify-content-between align-items-center">
                        <div><input type="checkbox" class="form-check-input me-2 service-item" value="wax" onchange="calculatePrice()"> ขัดเคลือบสี</div>
                    </label>
                `;
            } else if (category === 'bike') {
                container.innerHTML = `
                    <label class="service-checkbox-card d-flex justify-content-between align-items-center">
                        <div><input type="checkbox" class="form-check-input me-2 service-item" value="wash" checked disabled onchange="calculatePrice()"> ล้างสีมอเตอร์ไซค์</div>
                    </label>
                `;
            }
        }

        function calculatePrice() {
            const category = document.getElementById('vehicleCategory').value;
            const size = document.getElementById('vehicleSize').value;
            let total = 0;

            if (category && size) {
                if (category === 'bike') {
                    total = bikePrices[size] || 0;
                } else if (category === 'car') {
                    const checkboxes = document.querySelectorAll('.service-item:checked');
                    checkboxes.forEach(cb => {
                        const serviceKey = cb.value;
                        if (carPrices[size] && carPrices[size][serviceKey]) {
                            total += carPrices[size][serviceKey];
                        }
                    });
                }
            }

            document.getElementById('totalPrice').innerText = total.toFixed(2);
        }

        function submitForm(e) {
            e.preventDefault();
            alert("บันทึกข้อมูลเข้าคิวเรียบร้อยแล้ว!");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
