<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V CarCare - จัดการพนักงาน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #E0E0E0; font-family: sans-serif; }
        .text-orange { color: #FF6B00; }
        .bg-orange { background-color: #FF6B00; color: #121212; }
        .card-custom { background-color: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 12px; }
        .form-control-custom { background-color: #2A2A2A; border: 1px solid #3A3A3A; color: #FFFFFF; padding: 12px; }

        @media (max-width: 767.98px) {
            body { padding-top: 75px; }
            .fb-nav-tabs { position: fixed; top: 0; left: 0; right: 0; height: 65px; background-color: #1A1A1A; border-bottom: 1px solid #2A2A2A; display: flex; justify-content: space-around; align-items: stretch; z-index: 1050; }
            .fb-tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8E8E93; text-decoration: none; font-size: 11px; font-weight: bold; border-bottom: 3px solid transparent; }
            .fb-tab-item i { font-size: 22px; margin-bottom: 2px; }
            .fb-tab-item.active { color: #FF6B00; border-bottom-color: #FF6B00; }
        }

        @media (min-width: 768px) {
            .wrapper { display: flex; min-height: 100vh; }
            .sidebar { width: 260px; background-color: #1A1A1A; border-right: 1px solid #2A2A2A; padding: 20px; }
            .sidebar .nav-link { color: #8E8E93; padding: 12px 15px; border-radius: 8px; margin-bottom: 5px; font-weight: bold; }
            .sidebar .nav-link:hover { color: #FFFFFF; background-color: #2A2A2A; }
            .sidebar .nav-link.active { color: #121212; background-color: #FF6B00; }
            .main-content { flex-grow: 1; padding: 30px; background-color: #121212; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="sidebar d-none d-md-block">
            <h3 class="text-orange fw-bold text-center mb-4">V CARCARE</h3>
            <nav class="nav flex-column">
                <a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-2"></i> ภาพรวมระบบ</a>
                <a class="nav-link" href="pos.html"><i class="bi bi-plus-circle-fill"></i> รับรถหน้าร้าน (POS)</a>
                <a class="nav-link active" href="staff.html"><i class="bi bi-people-fill"></i> จัดการพนักงาน</a>
                <a class="nav-link" href="finance.html"><i class="bi bi-wallet2"></i> สรุปบัญชีรายรับ</a>
            </nav>
        </div>

        <div class="fb-nav-tabs d-flex d-md-none">
            <a href="index.html" class="fb-tab-item"><i class="bi bi-speedometer2"></i><span>ภาพรวม</span></a>
            <a href="pos.html" class="fb-tab-item"><i class="bi bi-plus-circle-fill"></i><span>รับรถ (POS)</span></a>
            <a href="staff.html" class="fb-tab-item active"><i class="bi bi-people-fill"></i><span>พนักงาน</span></a>
            <a href="finance.html" class="fb-tab-item"><i class="bi bi-wallet2"></i><span>บัญชี</span></a>
        </div>

        <div class="main-content w-100 p-3 p-md-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="fw-bold text-white m-0 d-none d-md-block">ระบบพนักงานและเวลาเข้างาน</h2>
                <button class="btn bg-orange text-dark fw-bold px-4 py-2 w-100 w-md-auto" data-bs-toggle="modal" data-bs-target="#addStaffModal"><i class="bi bi-person-plus-fill me-2"></i> ลงทะเบียนพนักงานใหม่</button>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-6"><div class="card-custom p-3 text-center"><small class="text-secondary">พนักงานในร้าน</small><h4 class="fw-bold text-white m-0" id="total-staff">1 คน</h4></div></div>
                <div class="col-6"><div class="card-custom p-3 text-center border-bottom border-success border-3"><small class="text-secondary">มาทำงานวันนี้</small><h4 class="text-success fw-bold m-0" id="checked-in-staff">0 คน</h4></div></div>
            </div>

            <div class="card-custom p-3 p-md-4">
                <div id="staff-list">
                    <div class="p-3 mb-2 rounded-3 border border-secondary" id="staff-1" style="background-color: #2A2A2A;">
                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
                            <div>
                                <h5 class="text-white fw-bold m-0">สมชาย ขยันล้าง</h5>
                                <small class="text-secondary">ตำแหน่ง: ช่างล้างรถประจำสถานี • ค่าแรง <span class="wage-val">350</span> บ./วัน</small>
                            </div>
                            <div class="d-flex gap-2 align-items-center" id="action-box-1">
                                <button class="btn btn-sm btn-success px-4" onclick="checkInStaff(1)">เช็คอินเข้างาน</button>
                                <button class="btn btn-sm btn-outline-warning" onclick="editWage(1)"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteStaff(1)"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addStaffModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered m-3 mx-auto" style="max-width: 450px;">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-orange fw-bold">ลงทะเบียนพนักงานใหม่</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2"><input type="text" id="staff-name" class="form-control form-control-custom" placeholder="ชื่อ-นามสกุล"></div>
                    <div class="mb-2"><input type="number" id="staff-wage" class="form-control form-control-custom" placeholder="ค่าแรงต่อวัน"></div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn bg-orange text-dark fw-bold w-100" onclick="appendStaff()">บันทึกพนักงาน</button>
                </div>
            </div>
        </div>
    </div>

<script>
    let activeStaffCount = 0;
    let totalStaffCount = 1;

    function checkInStaff(id) {
        document.getElementById(`action-box-${id}`).innerHTML = `<span class="badge bg-success py-2 px-3">✓ เข้างานแล้ว</span>`;
        activeStaffCount++;
        document.getElementById('checked-in-staff').innerText = activeStaffCount + " คน";
    }

    function editWage(id) {
        let newWage = prompt("กรอกอัตราค่าแรงใหม่ต่อวัน (บาท):");
        if(newWage && !isNaN(newWage)) {
            document.getElementById(`staff-${id}`).querySelector('.wage-val').innerText = newWage;
        }
    }

    function deleteStaff(id) {
        if(confirm("คุณต้องการลบรายชื่อพนักงานคนนี้ใช่หรือไม่?")) {
            document.getElementById(`staff-${id}`).remove();
            totalStaffCount--;
            document.getElementById('total-staff').innerText = totalStaffCount + " คน";
        }
    }

    function appendStaff() {
        let name = document.getElementById('staff-name').value;
        let wage = document.getElementById('staff-wage').value;
        if(!name || !wage) { alert('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }
        
        totalStaffCount++;
        let newId = Date.now();
        let html = `
            <div class="p-3 mb-2 rounded-3 border border-secondary" id="staff-${newId}" style="background-color: #2A2A2A;">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
                    <div>
                        <h5 class="text-white fw-bold m-0">${name}</h5>
                        <small class="text-secondary">ตำแหน่ง: พนักงานทั่วไป • ค่าแรง <span class="wage-val">${wage}</span> บ./วัน</small>
                    </div>
                    <div class="d-flex gap-2 align-items-center" id="action-box-${newId}">
                        <button class="btn btn-sm btn-success px-4" onclick="checkInStaff(${newId})">เช็คอินเข้างาน</button>
                        <button class="btn btn-sm btn-outline-warning" onclick="editWage(${newId})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteStaff(${newId})"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
            </div>`;
        document.getElementById('staff-list').insertAdjacentHTML('beforeend', html);
        document.getElementById('total-staff').innerText = totalStaffCount + " คน";
        
        // เคลียร์และปิดโมดอล
        document.getElementById('staff-name').value = '';
        document.getElementById('staff-wage').value = '';
        bootstrap.Modal.getInstance(document.getElementById('addStaffModal')).hide();
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
